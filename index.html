    <!-- FAQPage schema — rich snippets Google -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Comment fonctionne le tarif horaire ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Pour les mandats ponctuels ou les remplacements, nous facturons 35 $ de l'heure. Un devis vous est fourni avant tout travail."
          }
        },
        {
          "@type": "Question",
          "name": "Quel forfait mensuel me convient ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Micro-entreprise (149,99 $/mois, livrables trimestriels) pour peu de transactions sans employés ; Petite entreprise (249,99 $ – 599,99 $/mois) pour un volume moyen ; PME avec paie (599,99 $ – 999,99 $+/mois) pour les dossiers plus exigeants."
          }
        },
        {
          "@type": "Question",
          "name": "Mes documents sont-ils en sécurité ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Oui. Vos fichiers sont transmis chiffrés (TLS) et stockés dans une base de données hébergée au Canada, accessible uniquement par vous et votre préparateur comptable. Conformité PIPEDA et Loi 25."
          }
        },
        {
          "@type": "Question",
          "name": "Les prix affichés incluent-ils les taxes ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Non. Les tarifs sont hors taxes (TPS, TVH, TVQ, TVP, etc. selon votre province). Un devis détaillé vous est remis avant confirmation du mandat."
          }
        },
        {
          "@type": "Question",
          "name": "Combien coûte l'ouverture d'un dossier ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "L'ouverture de dossier coûte 149 $, offerte aux 10 premiers clients. L'accès au portail est inclus ; vous ne payez ensuite que pour les travaux effectués."
          }
        }
      ]
    }
