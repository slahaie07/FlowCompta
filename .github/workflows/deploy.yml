# Workflow Cloudflare Pages désactivé — déploiement géré par Vercel.
# Pour réactiver, remplacer 'workflow_dispatch' par 'push' et 'pull_request',
# et configurer CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID dans les secrets GitHub.

name: Cloudflare Pages Deployment

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: 📥 Récupérer le code source (Checkout)
        uses: actions/checkout@v4

      - name: 🟢 Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Installer les dépendances
        run: npm ci

      - name: ⚡ Compiler l'application (Vite + React)
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: 🚀 Déployer sur Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: comptaflow-platform
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
