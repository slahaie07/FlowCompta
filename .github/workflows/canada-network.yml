# CI/CD déplacé sur Vercel (gratuit avec le déploiement) — voir vercel.json buildCommand: npm run ci
# GitHub Actions nécessite un compte payant si la facturation est bloquée.
# Ce workflow reste disponible en manuel uniquement (workflow_dispatch).

name: Canada Network Deploy

on:
  workflow_dispatch:

concurrency:
  group: canada-network-manual
  cancel-in-progress: true

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: CI complet (lint + tests + build)
        run: npm run ci

      - name: Vérifier réseau production (optionnel)
        if: vars.COMPTAFLOW_URL != ''
        run: npm run verify:network
        env:
          COMPTAFLOW_URL: ${{ vars.COMPTAFLOW_URL }}
